name: Stack Deployment Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test-unifi:
    name: UniFi Controller
    runs-on: ubuntu-latest
    env:
      MONGO_USER: unifi
      MONGO_PASS: testpass
    steps:
      - uses: actions/checkout@v4
      - name: Test UniFi stack
        run: bash tests/run.sh network/unifi-controller

