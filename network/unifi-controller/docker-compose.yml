services:
  unifi-backup:
    image: mongo:7.0
    container_name: unifi-backup
    restart: "no"
    networks:
      - qnet
    volumes:
      - ${UNIFI_BACKUP_PATH:-/share/Container/unifi-controller/backups}:/backups
      - ${UNIFI_CONFIG_PATH:-/share/Container/unifi-controller/config}:/unifi-config
      - ./backup.sh:/backup.sh:ro
      - ./docker-compose.yml:/docker-compose.yml:ro
    environment:
      MONGO_HOST: unifi-db
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-unifi}
      MONGO_PASS: ${MONGO_PASS:-unifi-db-password}
      BACKUP_RETENTION: ${UNIFI_BACKUP_RETENTION:-7}
    depends_on:
      unifi-db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/backup.sh"]

  unifi-controller:
    image: lscr.io/linuxserver/unifi-network-application:10.3.58
    container_name: unifi-controller
    restart: unless-stopped
    networks:
      qnet:
        mac_address: "02:00:00:00:00:02"
    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
      - 1900:1900/udp
      - 8843:8843
      - 8880:8880
      - 6789:6789
      - 5514:5514/udp
    volumes:
      - ${UNIFI_CONFIG_PATH:-/share/Container/unifi-controller/config}:/config
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Madrid}
      MONGO_USER: ${MONGO_USER:-unifi}
      MONGO_PASS: ${MONGO_PASS:-unifi-db-password}
      MONGO_HOST: unifi-db
      MONGO_PORT: 27017
      MONGO_DBNAME: unifi
      MEM_LIMIT: ${UNIFI_MEM_HEAP:-3072m}
    depends_on:
      unifi-backup:
        condition: service_completed_successfully
      unifi-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${UNIFI_CPU_LIMIT:-2}
          memory: ${UNIFI_MEM_LIMIT:-4G}

  unifi-db:
    image: mongo:7.0
    container_name: unifi-db
    restart: unless-stopped
    networks:
      - qnet
    volumes:
      - ${UNIFI_DB_PATH:-/share/Container/unifi-controller/db}:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-unifi}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-unifi-db-password}
      MONGO_INITDB_DATABASE: unifi
    healthcheck:
      test: mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

networks:
  qnet:
    external: true
    name: qnet-static-bond0-0094fd
